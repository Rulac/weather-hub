<title>Weather Hub</title>
<style>
  /* position: fixed stops iOS 9 from dragging the whole page on a tap, which
     looked like the layout sliding down when a panel was switched. */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
               position: fixed; top: 0; left: 0; right: 0; bottom: 0;
               background: #000000; color: #e8eef7;
               font: 16px/1.35 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
               -webkit-text-size-adjust: 100%; -webkit-user-select: none; }
  .app { display: -webkit-box; display: -webkit-flex; display: flex;
         -webkit-flex-direction: column; flex-direction: column; height: 100%;
         -webkit-box-sizing: border-box; box-sizing: border-box; }
  /* black-translucent puts the page under the status bar; in kiosk mode the
     clock, device name and battery would sit on top of the chips. */
  body.kiosk .app { padding-top: 22px; }
  body.kiosk .overlay { padding-top: 22px; }

  /* header: place chips + language switch */
  .top { display: -webkit-flex; display: flex; padding: 10px 14px 0; }
  .chips { display: -webkit-flex; display: flex; -webkit-flex: 1; flex: 1; }
  .chip { -webkit-flex: 1 1 0; flex: 1 1 0; min-width: 0; text-align: center;
          padding: 13px 4px;
          font-size: 17px; color: #9a9a9a; background: #0e0e0e; border-radius: 9px;
          margin-right: 7px; border: 1px solid #1c1c1c; white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis; }
  .chip.on { background: #1c1c1c; color: #fff; border-color: #4a4a4a; font-weight: 600; }
  .lang { display: -webkit-flex; display: flex; -webkit-flex: 0 0 auto; flex: 0 0 auto; }
  .lang button { font: inherit; font-size: 15px; padding: 13px 11px; color: #7f7f7f;
                 background: #0e0e0e; border: 1px solid #1c1c1c; margin: 0;
                 text-transform: uppercase; position: relative; }
  .lang button + button { margin-left: -1px; }
  .lang button:first-child { border-radius: 9px 0 0 9px; }
  .lang button:last-child { border-radius: 0 9px 9px 0; }
  .lang button.on { background: #1c1c1c; color: #fff; border-color: #4a4a4a; z-index: 1; }
  .refresh { font: inherit; font-size: 19px; line-height: 1; padding: 12px 16px 14px;

             border: 1px solid #1c1c1c; border-radius: 9px; }
  .refresh.busy { color: #46d17a; }
  .chip.add { -webkit-flex: 0 0 46px; flex: 0 0 46px; margin-right: 7px;
              font-size: 22px; line-height: 1; padding: 10px 0 12px; }

  /* place picker */
  .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000000;
             display: none; z-index: 20; }
  .overlay.open { display: -webkit-box; display: -webkit-flex; display: flex;
                  -webkit-flex-direction: column; flex-direction: column; }
  .ovhead { display: -webkit-flex; display: flex; padding: 14px; }
  .ovhead input { -webkit-flex: 1; flex: 1; width: 100%; font: inherit; font-size: 20px;
                  padding: 12px 14px; background: #0e0e0e; color: #e8eef7;
                  border: 1px solid #1c1c1c; border-radius: 9px;
                  -webkit-appearance: none; -webkit-border-radius: 9px; }
  .ovhead button { font: inherit; font-size: 19px; margin: 0 0 0 8px; padding: 10px 18px;
                   background: #0e0e0e; color: #9a9a9a; border: 1px solid #1c1c1c;
                   border-radius: 9px; }
  .ovlist { -webkit-flex: 1; flex: 1; min-height: 0; overflow-y: auto;
            -webkit-overflow-scrolling: touch; padding: 0 14px 16px; }
  .ovrow { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
           padding: 12px 4px 12px 16px; border-bottom: 1px solid #161616; font-size: 20px; }
  .ovrow.cur { background: #0e0e0e; border-radius: 8px; }
  .ovname { -webkit-flex: 1; flex: 1; }
  .ovsub { display: inline-block; padding-left: 10px; color: #666666; font-size: 16px; }
  .ovstar { font-size: 24px; line-height: 1; color: #3a3a3a; padding: 8px 14px; }
  .ovdel { font-size: 30px; line-height: 1; color: #8a5252; padding: 6px 22px; }
  .ovstar.on { color: #ffb020; }
  .ovempty { padding: 22px 6px; color: #666666; font-size: 18px; }

  .lhead { -webkit-align-items: center; align-items: center; }
  .ltitle { -webkit-flex: 1; flex: 1; font-size: 21px; font-weight: 600; }
  .ovbody { -webkit-flex: 1; flex: 1; min-height: 0; overflow-y: auto;
            -webkit-overflow-scrolling: touch; padding: 0 20px 26px; }
  .lg-h { font-size: 13px; color: #666666; text-transform: uppercase;
          letter-spacing: 1px; margin: 20px 0 4px; }
  .lg-icons { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap;
              flex-wrap: wrap; }
  .lg-icons .lg-icon { width: 50%; -webkit-box-sizing: border-box;
                       box-sizing: border-box; padding-right: 14px; }
  .lg-icon { display: -webkit-flex; display: flex; -webkit-align-items: center;
             align-items: center; padding: 8px 0; border-bottom: 1px solid #161616;
             font-size: 17px; }
  .lg-icon .ic { width: 34px; height: 34px; margin-right: 14px;
                 -webkit-flex: 0 0 auto; flex: 0 0 auto; }
  .lg-names { display: -webkit-flex; display: flex;
              -webkit-flex-direction: column; flex-direction: column; }
  .lg-names .hr { font-size: 17px; }
  .lg-names .en { font-size: 14px; color: #7f7f7f; }
  .lg-row { display: -webkit-flex; display: flex; padding: 9px 0;
            border-bottom: 1px solid #161616; font-size: 16px; }
  .lg-row .k { width: 196px; -webkit-flex: 0 0 196px; flex: 0 0 196px;
               color: #e8eef7; font-weight: 500; padding-right: 14px; }
  .lg-row .v { color: #9a9a9a; -webkit-flex: 1; flex: 1; min-width: 0; }
  .lg-row .v b { color: #e8eef7; font-weight: 600; }
  .lg-row .v.ok { color: #46d17a; }
  .lg-row .v.err { color: #ff8a6b; }
  .foot #foot-left { border-bottom: 1px dotted #3a3a3a; padding: 4px 0;
                     overflow: hidden; text-overflow: ellipsis; }
  .lg-row .v a { color: #6bb6ff; text-decoration: none;
                 word-break: break-all; -webkit-word-break: break-all; }
  .installbtn { display: block; margin: 10px 0 14px; padding: 20px 16px; text-align: center;
                background: #1c1c1c; color: #ffffff; text-decoration: none;
                font-size: 22px; font-weight: 600; border-radius: 12px;
                border: 1px solid #4a4a4a; }
  .installbtn:active { background: #262626; }
  .lg-note { margin-top: 22px; color: #666666; font-size: 14px; line-height: 1.7; }
  .lg-keynote { margin: 10px 0 4px; padding: 9px 12px; background: #0e0e0e;

  .lg-keynote b { color: #e8eef7; font-weight: 600; }
  .lg-keynote a { color: #6bb6ff; text-decoration: none; }
  .lg-radio { display: block; margin: 9px 0; color: #c8c8c8; font-size: 15px;
              line-height: 1.3; }
  .lg-radio input { margin-right: 9px; vertical-align: -1px; }
  .keyinput { width: 100%; font: inherit; font-size: 16px; padding: 9px 12px;
              background: #0e0e0e; color: #e8eef7; border: 1px solid #1c1c1c;
              border-radius: 8px; -webkit-appearance: none;
              -webkit-box-sizing: border-box; box-sizing: border-box; }
  .keybtn { font: inherit; font-size: 15px; padding: 10px 18px; margin: 4px 8px 4px 0;
            background: #0e0e0e; color: #e8eef7; border: 1px solid #2a2a2a;
            border-radius: 8px; }
  .keybtn.danger { color: #c98b8b; border-color: #3a2626; }

  /* Percentage heights are unreliable inside flex items on iOS 9; intrinsic
     sizing with max-width/height keeps the stream centred and letterboxed. */

  /* current conditions */
  .now { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
         padding: 0 24px; }
  .now .glyphcol { -webkit-flex: 0 0 126px; flex: 0 0 126px;
                   display: -webkit-flex; display: flex;
                   -webkit-flex-direction: column; flex-direction: column;
                   -webkit-align-items: center; align-items: center; }
  .now .glyph { font-size: 106px; line-height: 1; width: 126px;
                text-align: center; }
  .now .temp { font-size: 88px; font-weight: 200; letter-spacing: -3px; }
  .now .clock { font-size: 29px; font-weight: 300; letter-spacing: 1px;
                padding-top: 1px; text-align: center; }
  .now .temp .unit { font-size: 34px; font-weight: 300; letter-spacing: 0; color: #9a9a9a;
                     margin-left: 4px; vertical-align: 26px; }
  .now .meta { margin-left: 24px; line-height: 1.5; display: -webkit-flex; display: flex;
               -webkit-align-items: flex-end; align-items: flex-end;
               font-size: 21px; color: #9a9a9a; }
  /* Block flow, not flex: as a column-flex box every text node and <b> became
     its own flex item, so "vjetar" and its value ended up on separate lines. */
  .now .meta .mcol { display: block; }
  .now .meta .mcol + .mcol { margin-left: 30px; }
  .now .meta .lbl { color: #7f7f7f; font-size: 17px; }
  .now .meta .lbl + b { margin-left: 6px; }
  .now .meta b { color: #e8eef7; font-weight: 500; }
  .now .meta .cond { color: #e8eef7; font-size: 24px; }
  .now .meta .sun { font-size: 18px; line-height: 1.55; }
  .now .meta .src { color: #5f5f5f; font-size: 13px; padding-top: 4px; }
  .now .place { margin-left: auto; text-align: right; }
  .now .place .name { font-size: 42px; font-weight: 500; }
  .now .place .coords { font-size: 15px; color: #666666; line-height: 1.3;
                        overflow: hidden; text-overflow: ellipsis; }

  /* top-level switch: the forecast (hours, then days) or the comparison */
  /* the gap under the buttons lives on the panels, so all three start alike */
  .viewsbar { padding: 0 18px; }
  .views { -webkit-flex: 1; flex: 1; min-height: 0;
           display: -webkit-flex; display: flex;
           -webkit-flex-direction: column; flex-direction: column; }

  /* hourly strip: the next 24 hours, scrolled sideways if the screen is narrow */
  .forecast { display: none; }
  .forecast.on { display: -webkit-flex; display: flex; -webkit-flex: 1; flex: 1;
                 min-height: 0; -webkit-flex-direction: column; flex-direction: column;
                 -webkit-justify-content: flex-start; justify-content: flex-start;
                 padding-top: 16px; }
  .hours { display: -webkit-flex; display: flex; padding: 2px 10px 4px;
           overflow-x: auto; -webkit-overflow-scrolling: touch; min-height: 135px; }
  .hour { -webkit-flex: 1 0 38px; flex: 1 0 38px; text-align: center;
          padding: 3px 0 4px; margin: 0 1px; }
  .hour.cur { background: #171717; }
  .hour.mid { border-left: 1px solid #2a2a2a; }
  .hour .ht { font-size: 16px; color: #9a9a9a; }
  .hour.cur .ht { color: #ffffff; font-weight: 500; }
  .hour .hd { font-size: 11px; color: #5a5a5a; height: 15px;
             white-space: nowrap; overflow: hidden; }
  .hour .g { font-size: 36px; line-height: 1.16; }
  .hour .temp { font-size: 21px; font-weight: 500; }
  .hour .w { font-size: 14px; color: #8a8a8a; height: 18px; line-height: 18px; }
  .hour .pp { font-size: 11px; color: #6bb6ff; height: 15px; }
  .w .ar { display: inline-block; width: 1.05em; height: 1.05em;
           margin-right: 6px; vertical-align: -0.12em; }
  .w .ar svg { display: block; width: 100%; height: 100%; }
  .hnote { padding: 18px; color: #666666; font-size: 16px; }

  /* daily strip */
  .strip { display: -webkit-flex; display: flex; padding: 0 10px; }
  .day { -webkit-flex: 1; flex: 1; text-align: center; padding: 5px 0 3px;
         margin: 0 2px; }
  .day.today { background: #171717; }
  .day.weekend { background: #121212;
                 -webkit-box-shadow: inset 0 -3px 0 0 #2e2e2e;
                 box-shadow: inset 0 -3px 0 0 #2e2e2e; }
  .day.weekend .dn { color: #c9c9c9; font-weight: 600; }
  .day .dn { font-size: 18px; color: #9a9a9a; }
  .day .dd { font-size: 15px; color: #5a5a5a; }
  .day .g { font-size: 42px; line-height: 1.2; }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
  .day .hi { font-size: 27px; font-weight: 500; }
  .day .lo { font-size: 20px; color: #7f7f7f; padding-top: 1px; }
  .day .w { font-size: 16px; color: #8a8a8a; height: 22px; line-height: 22px; }
  .day .sp { font-size: 14px; color: #ffb020; height: 24px; }

  /* comparison: providers against the clock (hours) and against the calendar
     (days), both with providers as rows so the two tables read the same way */
  .rule { height: 0; border: 0; border-top: 1px solid #262626;
          margin: 13px 0; }
  .seg { display: -webkit-flex; display: flex; }
  .seg button { font: inherit; font-size: 15px; padding: 10px 20px; color: #7f7f7f;
                outline: none; -webkit-tap-highlight-color: transparent;
                background: #0e0e0e; border: 1px solid #1c1c1c; margin: 0;
                text-transform: uppercase; letter-spacing: .5px; position: relative; }
  .seg button:first-child { border-radius: 8px 0 0 8px; }
  .seg button + button { margin-left: -1px; }
  .seg button:last-child { border-radius: 0 8px 8px 0; }
  .seg button.on { background: #1c1c1c; color: #fff; border-color: #4a4a4a; z-index: 1; }

  table { width: 100%; border-collapse: collapse; font-size: 17px; }
  th, td { text-align: center; padding: 7px 2px; border-bottom: 1px solid #161616; }
  th { color: #9a9a9a; font-weight: 500; font-size: 15px; }
  th:first-child { text-align: left; padding-left: 2px; }

  .cmp { display: none; padding: 0 14px; }
  .cmp.on { display: -webkit-flex; display: flex; -webkit-flex: 1; flex: 1;
            min-height: 0; -webkit-flex-direction: column; flex-direction: column; }
  #panel-byhour.on { padding-top: 16px; }
  .ctwrap { -webkit-flex: 1; flex: 1; min-height: 0; overflow-y: auto;
            -webkit-overflow-scrolling: touch; }
  .mstats { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap;
            flex-wrap: wrap; -webkit-align-items: baseline; align-items: baseline;
            font-size: 15px; color: #7f7f7f; margin: 10px 0; }
  .mstats b { color: #e8eef7; font-weight: 600; font-size: 16px; }
  .mstats .stat { white-space: nowrap; }
  .mstats .sp { width: 12px; }
  .mstats .up { color: #ff8a6b; }
  .mstats .down { color: #6bb6ff; }

  /* One table per screen, and the whole horizon has to fit it: the cell stacks
     the icon over the numbers, so a column needs about thirty pixels instead of
     fifty-five and fifteen days (or twenty-four hours) fit without scrolling. */
  .ct { border-collapse: collapse; width: 100%; table-layout: fixed; }
  .ct th, .ct td { padding: 9px 0; border-bottom: 1px solid #161616;
                   text-align: center; }
  .ct th { font-weight: 500; color: #9a9a9a; font-size: 13px; }
  .ct th:first-child, .ct td.src { text-align: left; width: 64px; }
  .ct td.src { font-size: 13px; color: #9a9a9a; white-space: normal;
               padding-left: 2px; line-height: 1.05; }
  .ct td.src .sc { display: block; font-size: 10px; color: #5a5a5a;
                   line-height: 1.15; }
  .ct td.src.off { color: #4f4f4f; }
  .ct td.src.off .sc { color: #3f3f3f; }
  .ct .hh { display: block; font-size: 13px; color: #9a9a9a; }
  .ct .dd2 { display: block; font-size: 11px; color: #5a5a5a; line-height: 1.2;
             min-height: 13px; }
  .ct th.weekend, .ct td.weekend { background: #121212; }
  .ct th.cur, .ct td.cur { background: #171717; }
  .ct td .ic { display: block; width: 32px; height: 32px; margin: 0 auto 2px;
               vertical-align: baseline; }
  .ct .hi, .ct .lo { display: block; white-space: nowrap; }
  .ct .hi { font-size: 19px; font-weight: 600; line-height: 1.1; }
  .ct .lo { font-size: 15px; color: #7f7f7f; line-height: 1.1; }
  .ct .na { color: #4a4a4a; }
  .ct tr.spread td { color: #ffb020; font-size: 14px; padding-bottom: 6px; }
  .ct tr.spread td.src { color: #666666; }
  /* four rows instead of five leave more air: the hours table breathes more */
  #hour-table { font-size: 15px; }
  #hour-table th, #hour-table td { padding: 16px 0; }
  #hour-table td .ic { width: 22px; height: 22px; }

  /* Landscape has half the height: the same five rows have to fit in it, so
     the cells lose their air instead of the table losing its last days. */
  @media (max-height: 820px) {
    .ct th, .ct td { padding: 2px 0; }
    .ct td .ic { width: 20px; height: 20px; margin-bottom: 1px; }
    .ct .hi { font-size: 15px; }
    .ct .lo { font-size: 11px; }
    .ct th { font-size: 12px; }
    .ct .hh { font-size: 12px; }
    .ct .dd2 { font-size: 10px; min-height: 11px; }
    .ct td.src { font-size: 11px; }
    .ct td.src .sc { font-size: 9px; }
    /* four rows and plenty of height: the hours table can grow instead of
       shrinking with the rest */
    #hour-table { font-size: 19px; }
    #hour-table th, #hour-table td { padding: 9px 0; }
    #hour-table td .ic { width: 28px; height: 28px; }
  }
  .ct tbody tr:last-child td { border-bottom: none; }

  /* night dimming: 22:00-07:00 the whole screen is darkened so the kitchen
     does not glow into the next room; a tap lifts it for one minute. */
  #dim { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000;
         opacity: 0; pointer-events: none; z-index: 40;
         -webkit-transition: opacity 1.2s ease; transition: opacity 1.2s ease; }
  #dim.on { opacity: 0.68; }
  #dim.soft { opacity: 0.1; }

  /* footer */
  .foot { margin-top: auto; display: -webkit-flex; display: flex;
          overflow: hidden; white-space: nowrap;
          -webkit-align-items: center; align-items: center;
          padding: 3px 18px 2px; font-size: 14px; color: #666666;
          border-top: 1px solid #262626; }
  .footmain { -webkit-flex: 1 1 0; flex: 1 1 0; min-width: 0;
              display: -webkit-flex; display: flex;
              -webkit-align-items: center; align-items: center; }
  .footmain .refresh { font-size: 15px; line-height: 1; padding: 4px 9px 6px;
                       margin: 0 10px 0 0; }
  .footmid { -webkit-flex: 0 0 auto; flex: 0 0 auto;
             display: -webkit-flex; display: flex;
             -webkit-align-items: center; align-items: center; }
  .foottools { -webkit-flex: 1 1 0; flex: 1 1 0; min-width: 0;
               -webkit-justify-content: flex-end; justify-content: flex-end;
               display: -webkit-flex; display: flex;
               -webkit-align-items: center; align-items: center; }
  .foottools #foot-right { margin-right: 16px; overflow: hidden;
                           text-overflow: ellipsis; }
  .foottools .lang button { font-size: 12px; padding: 5px 10px; border-radius: 0; }
  .foottools .lang button:first-child { border-radius: 7px 0 0 7px; }
  .foottools .lang button:last-child { border-radius: 0 7px 7px 0; }
  .foot .legend { font: inherit; font-size: 14px; margin-left: 14px; color: #7f7f7f;
                  background: none; border: none; border-bottom: 1px dotted #3a3a3a;
                  padding: 6px 0; display: -webkit-inline-flex; display: inline-flex;
                  -webkit-align-items: center; align-items: center; }
  .foot .legend:first-child { margin-left: 0; }
  .foot .legend svg { margin-right: 5px; }
  .foot .err { color: #ffb020; }
  /* tapping the version forces a fresh shell; the only way out when the iPad
     is stuck on an old build. */
  .foot .ver { color: #7f7f7f; border-bottom: 1px dotted #3a3a3a; padding: 4px 2px; }

  /* Phones: the kiosk frame becomes an ordinary scrolling page. The iPad keeps
     the fixed 100% layout above, because there everything has to fit at once. */
  @media (max-width: 700px), (max-height: 500px) and (orientation: landscape) {
    html, body { height: auto; min-height: 100%; overflow: visible;
                 position: static; }
    body { overflow-x: hidden; overflow-y: auto;
           -webkit-overflow-scrolling: touch; }
    .app { height: auto; min-height: 100%; min-height: 100vh; }

    .top { padding: 8px 10px 0; }
    .chip { font-size: 15px; padding: 10px 3px; }

    /* the current block wraps: glyph and temperature first, details below */
    .now { -webkit-flex-wrap: wrap; flex-wrap: wrap;
           -webkit-align-items: flex-start; align-items: flex-start;
           padding: 4px 14px 8px; }
    .now .glyphcol { -webkit-flex: 0 0 78px; flex: 0 0 78px;
                     -webkit-order: 1; order: 1; }
    .now .glyph { font-size: 64px; width: 78px; }
    .now .clock { display: none; }
    .now .temp { font-size: 58px; letter-spacing: -2px;
                 -webkit-order: 2; order: 2; }
    .now .temp .unit { font-size: 22px; vertical-align: 14px; }
    .now .place { margin-left: auto; max-width: 46%; padding-top: 17px;
                  -webkit-order: 3; order: 3; }
    .now .place .name { font-size: 25px; line-height: 1.15; white-space: nowrap;
                        overflow: hidden; text-overflow: ellipsis; }
    .now .place .coords { font-size: 12px; }

    .day .lo { font-size: 17px; }
    .day .w { font-size: 14px; }

    /* comparisons: the page scrolls; each table gets its own sideways strip,

<div class="app">
  <div class="top">

            <thead><tr id="day-head"></tr></thead>
            <tbody id="day-body"></tbody>

  <div class="foot">

      <button type="button" class="refresh" id="refresh" title="Refresh">&#8635;</button>
      <div id="foot-left">&ndash;</div>

    <div class="footmid">
      <button type="button" class="legend" id="legend-link"></button>

      <span id="foot-right"></span>
      <div class="lang" id="lang">

</div>

<div id="dim"></div>

<div class="overlay" id="logpanel">

</div>

<div class="overlay" id="install">

        if (slot.max === null || temp > slot.max) slot.max = temp;
      }
      symbol = (entry.data.next_1_hours && entry.data.next_1_hours.summary &&
                entry.data.next_1_hours.summary.symbol_code) ||
               (entry.data.next_6_hours && entry.data.next_6_hours.summary &&
                entry.data.next_6_hours.summary.symbol_code) || null;
      if (symbol) slot.symbols[symbol] = (slot.symbols[symbol] || 0) +
        (stamp.getHours() >= 11 && stamp.getHours() <= 14 ? 3 : 1);
    }
    order.sort();
    var out = { time: order, min: [], max: [], symbol: [] };
    for (i = 0; i < order.length; i++) {
      slot = days[order[i]];
      out.min.push(slot.min === null ? null : Math.round(slot.min * 10) / 10);
      out.max.push(slot.max === null ? null : Math.round(slot.max * 10) / 10);
      out.symbol.push(bestSymbol(slot.symbols));
    }
    return out.time.length ? out : null;
  }

  function bestSymbol(symbols) {
    var best = null, key;
    for (key in symbols) if (best === null || symbols[key] > symbols[best]) best = key;
    return best;
  }

  function pad2(value) { return (value < 10 ? "0" : "") + value; }

  function fetchMet(place, done) {
    var now = (new Date()).getTime();
    if (now < blockedUntil) { done(false); return; }
    var request = new XMLHttpRequest();
    request.open("GET", "https://api.met.no/weatherapi/locationforecast/2.0/compact" +
                 "?lat=" + place.lat.toFixed(4) + "&lon=" + place.lon.toFixed(4) +
                 "&altitude=" + (place.ele || 0), true);
    request.timeout = 20000;
    request.onload = function () {
      if (request.status < 200 || request.status >= 300) { done(false); return; }
      var met = null;
      try { met = metDays(JSON.parse(request.responseText)); } catch (e) { met = null; }
      if (met) {
        place.providers = place.providers || {};
        place.providers.met = met;
        logLine("MET: ok (" + met.time.length + " dana)", "ok");
        savePlaceCache(place);
        lastSuccess = (new Date()).getTime();
        if (state.data) {
          state.data.generated = (new Date()).toISOString().replace(/\.[0-9]+Z$/, "Z");
        }
      }
      done(!!met);
    };
    request.onerror = request.ontimeout = function () {
      lastProblem = t("tagNet");
      logLine("MET: mreža / TLS", "err");
      done(false);
    };
    request.send();
  }

  function fetchPlaceForecast(place, done) {
    var now = (new Date()).getTime();
    if (now < blockedUntil) { done(false); return; }
    if (place.fetchedAt && now - place.fetchedAt < FRESH_MS &&
        place.hourly && place.hourlyModels) {
      done(true);
      return;
    }
    var url = placeUrl(place);
    var request = new XMLHttpRequest();
    request.open("GET", url, true);
    request.timeout = 20000;
    request.onload = function () {
      if (request.status === 429) {
        blockedUntil = (new Date()).getTime() + 30 * 60 * 1000;
        lastProblem = t("tagQuota");
        logLine("Open-Meteo: 429, dnevna kvota potrošena", "err");
        done(false);
        return;
      }
      if (request.status < 200 || request.status >= 300) {
        lastProblem = t("tagHttp") + " " + request.status;
        logLine("Open-Meteo: HTTP " + request.status, "err");
        done(false);
        return;
      }
      try {
        var block = JSON.parse(request.responseText);
        if (block && block.length) block = block[0];
        mergeOne(place, block);
        place.fetchedAt = (new Date()).getTime();
        lastProblem = "";
        logLine("Open-Meteo: ok (" + place.name + ")", "ok");
        savePlaceCache(place);
        /* The footer must reflect what is on screen, not the payload's age:
           a place fetched directly is the freshest thing there is. */
        lastSuccess = (new Date()).getTime();
        if (state.data) {
          state.data.generated = (new Date()).toISOString().replace(/\.[0-9]+Z$/, "Z");
        }
        done(true);
      } catch (e) { done(false); }
    };
    request.onerror = request.ontimeout = function () { done(false); };
    request.send();
  }

  function mergeOne(place, block) {
    var merged = {}, j, suffix, hasModel = false;
    for (j = 0; j < MODELS.length; j++) {
      suffix = "_" + MODELS[j];
      if (!block.daily || !block.daily["temperature_2m_max" + suffix]) continue;
      merged[MODELS[j]] = {
        time: block.daily.time,
        max: block.daily["temperature_2m_max" + suffix],
        min: block.daily["temperature_2m_min" + suffix],
        code: block.daily["weather_code" + suffix],
        precip: block.daily["precipitation_sum" + suffix],
        wind: block.daily["wind_speed_10m_max" + suffix] || null,
        wdir: block.daily["wind_direction_10m_dominant" + suffix] || null
      };
      hasModel = true;
    }
    /* Do not insist on ECMWF: if it is the one that failed, ICON still has to
       reach the screen. */
    if (hasModel) place.models = merged;
    if (block.current) place.current = block.current;
    var hourly = parseHourly(block, place);
    if (hourly) {
      place.hourly = hourly.primary;
      place.hourlyModels = hourly.models;
    }
  }

  var HOURLY_FIELDS = [["temperature_2m", "temp"], ["weather_code", "code"],
                       ["precipitation_probability", "precip"], ["is_day", "day"]];

  /* Wind and humidity are extra: a model without them keeps its temperature
     row in the comparison instead of vanishing from the table. */
  var HOURLY_EXTRA = [["wind_speed_10m", "wind"], ["wind_direction_10m", "wdir"],
                      ["relative_humidity_2m", "humidity"]];

  /* Hourly values come back suffixed per model. The forecast strip needs one
     line, the hourly comparison needs every model, so keep both; they share
     the single time axis of the response. */
  function parseHourly(block, place) {
    var data = block && block.hourly, models = {}, keys = [], i, j, key, slot, values;
    if (!data || !data.time) return null;
    for (i = 0; i < MODELS.length; i++) {
      key = MODELS[i];
      slot = {};
      for (j = 0; j < HOURLY_FIELDS.length; j++) {
        values = data[HOURLY_FIELDS[j][0] + "_" + key];
        if (!values) { slot = null; break; }
        slot[HOURLY_FIELDS[j][1]] = values;
      }
      if (slot) {
        slot.time = data.time;
        for (j = 0; j < HOURLY_EXTRA.length; j++) {
          slot[HOURLY_EXTRA[j][1]] = data[HOURLY_EXTRA[j][0] + "_" + key] || null;
        }
        models[key] = slot;
      }
    }
    key = primaryKey(place);
    if (key) keys.push(key);
    for (i = 0; i < MODELS.length; i++) {
      if (keys.indexOf(MODELS[i]) < 0) keys.push(MODELS[i]);
    }
    var primary = null;
    for (i = 0; i < keys.length; i++) {
      if (models[keys[i]]) { primary = keys[i]; break; }
    }
    if (!primary) return null;
    return {
      primary: { time: data.time, temp: models[primary].temp,
                 code: models[primary].code, precip: models[primary].precip,
                 day: models[primary].day, wind: models[primary].wind,
                 wdir: models[primary].wdir, humidity: models[primary].humidity },
      models: models
    };
  }

  /* The home block used to come from Open-Meteo's best-match current reading
     while the strips came from ECMWF, so the same hour could show two
     temperatures. Read the current hour of the primary model instead and keep
     the current block as the fallback for an old cache. */
  function currentValues(place) {
    var current = place.current || {};
    var values = {
      temperature_2m: current.temperature_2m,
      weather_code: current.weather_code,
      wind_speed_10m: current.wind_speed_10m,
      relative_humidity_2m: current.relative_humidity_2m,
      is_day: current.is_day
    };
    var hourly = hourlyFor(place);
    if (hourly && hourly.time) {
      var at = hourStartIndex(hourly.time);
      if (at.index >= 0) {
        if (hourly.temp && hourly.temp[at.index] !== null &&
            hourly.temp[at.index] !== undefined) {
          values.temperature_2m = hourly.temp[at.index];
        }
        if (hourly.code && hourly.code[at.index] !== null &&
            hourly.code[at.index] !== undefined) {
          values.weather_code = hourly.code[at.index];
        }
        if (hourly.wind && hourly.wind[at.index] !== null &&
            hourly.wind[at.index] !== undefined) {
          values.wind_speed_10m = hourly.wind[at.index];
        }
        if (hourly.humidity && hourly.humidity[at.index] !== null &&
            hourly.humidity[at.index] !== undefined) {
          values.relative_humidity_2m = hourly.humidity[at.index];
        }
        if (hourly.day && hourly.day[at.index] !== null &&
            hourly.day[at.index] !== undefined) {
          values.is_day = hourly.day[at.index];
        }
      }
    }
    return values;
  }

  /* Wind arrives in km/h and degrees (the direction it blows from). The arrow
     points where it is going, so north wind points down the screen. Drawn as
     an SVG: a rotated text arrow sat against the number and read as a digit. */
  function windArrow(deg) {
    return '<span class="ar" style="-webkit-transform:rotate(' + deg +
      'deg);transform:rotate(' + deg + 'deg)">' +
      '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v10M4 8.5' +
      ' 8 12.5l4-4" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  }

  function windHtml(speed, dir) {
    if (speed === null || speed === undefined) return "";
    var html = "";
    if (dir !== null && dir !== undefined && speed >= 1) {
      html = windArrow(Math.round(dir));
    }
    return html + round(speed);
  }

  /* The next 24 hours, from the current one. The point of the screen is what
     the hours ahead look like, so this sits above the daily strip. */
  function renderHours(place) {
    var hourly = hourlyFor(place), html = "", i, stamp, date, hour, night, shown = 0;
    if (!hourly || !hourly.time || !hourly.time.length) {
      $("hours").innerHTML = '<div class="hnote">' + t("noData") + "</div>";
      return;
    }
    var at = hourStartIndex(hourly.time);
    /* A cache from yesterday would otherwise show a day of hours that have
       already happened; better an empty line until the refresh lands. */
    if (at.index < 0) {
      $("hours").innerHTML = '<div class="hnote">' + t("noData") + "</div>";
      return;
    }
    var start = at.index;
    for (i = start; i < hourly.time.length && shown < 24; i++, shown++) {
      stamp = hourly.time[i];
      hour = +stamp.slice(11, 13);
      date = parseIsoDate(stamp.slice(0, 10));
      night = hourly.day ? hourly.day[i] === 0 : false;
      var isNow = i === start && stamp === at.key;
      var mm = hourly.precip ? hourly.precip[i] : null;
      html += '<div class="hour' + (isNow ? " cur" : "") +
        (hour === 0 ? " mid" : "") + '">' +
        '<div class="ht">' + (isNow ? t("nowLabel") : hourLabel(hour)) + "</div>" +
        '<div class="hd">' + (hour === 0 ? dayName(date.getDay()) : "") + "</div>" +
        '<div class="g">' + iconForWmo(hourly.code ? hourly.code[i] : null, night) + "</div>" +
        '<div class="temp">' + round(hourly.temp[i]) + "\u00b0</div>" +
        '<div class="w">' + windHtml(hourly.wind ? hourly.wind[i] : null,
                                     hourly.wdir ? hourly.wdir[i] : null) + "</div>" +
        '<div class="pp">' + (mm !== null && mm !== undefined && mm >= 20 ? mm + "%" : "") +
        "</div></div>";
    }
    $("hours").innerHTML = html;
  }

  /* First hour that has not passed yet, and the key it was matched against. */
  function hourStartIndex(times) {
    var now = new Date();
    var nowKey = now.getFullYear() + "-" + pad2(now.getMonth() + 1) + "-" +
      pad2(now.getDate()) + "T" + pad2(now.getHours()) + ":00";
    for (var i = 0; i < times.length; i++) {
      if (times[i] >= nowKey) return { index: i, key: nowKey };
    }
    return { index: -1, key: nowKey };
  }

  function hourLabel(hour) {
    return (hour < 10 ? "0" : "") + hour + "h";
  }

  function renderStrip(place, series) {
    var html = "", i, date, values, deviation;
    if (!series) { $("strip").innerHTML = '<div class="day">' + t("noData") + "</div>"; return; }
    for (i = 0; i < series.time.length; i++) {
      date = parseIsoDate(series.time[i]);
      values = [];
      for (var key in (place.models || {})) values.push(place.models[key].max[i]);
      deviation = spread(values);
      var weekend = date.getDay() === 0 || date.getDay() === 6;
      html += '<div class="day' + (i === 0 ? " today" : "") +
        (weekend ? " weekend" : "") + '">' +
        '<div class="dn">' + dayName(date.getDay()) + "</div>" +
        '<div class="dd">' + formatDate(date) + "</div>" +
        '<div class="g">' + iconForWmo(series.code ? series.code[i] : null) + "</div>" +
        '<div class="hi">' + round(series.max[i]) + "\u00b0</div>" +
        '<div class="lo">' + round(series.min[i]) + "\u00b0</div>" +
        '<div class="w">' + windHtml(series.wind ? series.wind[i] : null,
                                    series.wdir ? series.wdir[i] : null) + "</div>" +
        '<div class="sp">' + (deviation >= 2 ? "\u00b1" + Math.round(deviation) : "") + "</div>" +
        "</div>";
    }
    $("strip").innerHTML = html;
  }


  /* All of it in two tables, read the same way: one line per provider, hours
     across for the next day, days across for the whole horizon. */
  function renderCompare(place, series) {
    renderHourCompare(place);
    renderDayCompare(place, series);
  }

  function hourlyRows(place) {
    var rows = [], models = place.hourlyModels || {}, key, i;
    for (i = 0; i < BASE_SOURCES.length; i++) {
      key = BASE_SOURCES[i][0];
      if (models[key]) {
        rows.push([key, BASE_SOURCES[i][1], models[key]]);
      } else if (!place.hourlyModels && place.hourly && key === primaryKey(place)) {
        /* a cache from before the hourly comparison: one line is better than none */
        rows.push([key, BASE_SOURCES[i][1], place.hourly]);
      }
    }
    return rows;
  }

  function renderHourCompare(place) {
    var axis = place.hourly ? place.hourly.time : null;
    var rows = hourlyRows(place), head = "<th></th>", body = "", hours = 24;
    var at = axis ? hourStartIndex(axis) : { index: -1 };
    var i, j, date, hour, cls, value, night, temps, deviation;
    if (!axis || at.index < 0) {
      $("hour-head").innerHTML = head;
      $("hour-body").innerHTML =
        '<tr><td class="src">' + t("noData") + "</td></tr>";
      return;
    }
    for (i = at.index; i < axis.length && i < at.index + hours; i++) {
      hour = +axis[i].slice(11, 13);
      date = parseIsoDate(axis[i].slice(0, 10));
      head += "<th" + (i === at.index ? ' class="cur"' :
        (hour === 0 ? ' class="weekend"' : "")) + ">" +
        '<span class="hh">' + hourLabel(hour) + "</span>" +
        '<span class="dd2">' + (hour === 0 ? dayName(date.getDay()) : "") +
        "</span></th>";
    }
    $("hour-head").innerHTML = head;

    for (j = 0; j < rows.length; j++) {
      body += '<tr><td class="src">' + sourceLabel(rows[j][0], rows[j][1]) + "</td>";
      for (i = at.index; i < axis.length && i < at.index + hours; i++) {
        hour = +axis[i].slice(11, 13);
        cls = i === at.index ? ' class="cur"' : (hour === 0 ? ' class="weekend"' : "");
        value = rows[j][2].temp ? rows[j][2].temp[i] : null;
        night = rows[j][2].day ? rows[j][2].day[i] === 0 : false;
        body += "<td" + cls + ">" +
          (value === null || value === undefined
            ? '<span class="na">\u00b7</span>'
            : iconForWmo(rows[j][2].code ? rows[j][2].code[i] : null, night) +
              round(value) + "\u00b0") + "</td>";
      }
      body += "</tr>";
    }

    /* A single source has nothing to differ from; otherwise the spread reads
       the same way as in the daily table, only per hour instead of per day. */
    if (rows.length > 1) {
      body += '<tr class="spread"><td class="src">' + t("spreadRow") + "</td>";
      for (i = at.index; i < axis.length && i < at.index + hours; i++) {
        hour = +axis[i].slice(11, 13);
        cls = i === at.index ? ' class="cur"' : (hour === 0 ? ' class="weekend"' : "");
        temps = [];
        for (j = 0; j < rows.length; j++) {
          temps.push(rows[j][2].temp ? rows[j][2].temp[i] : null);
        }
        deviation = spread(temps);
        body += "<td" + cls + ">" +
          (deviation >= 2 ? "\u00b1" + Math.round(deviation) : "") + "</td>";
      }
      body += "</tr>";
    }
    $("hour-body").innerHTML = body;
  }

  /* A provider's list starts where its own fetch started, and a source with a
     shorter horizon stops earlier, so the columns have to be matched by date.
     Reading them by position shifts a whole row by a day as soon as one source
     is a little older than the others, and empties the column completely when
     it is older by more than its horizon. */
  function dayIndex(provider, date) {
    if (!provider || !provider.time) return -1;
    for (var i = 0; i < provider.time.length; i++) {
      if (String(provider.time[i]).slice(0, 10) === date) return i;
    }
    return -1;
  }

  /* A provider that answered keeps its row; a dead one is dimmed but stays,
     so a broken source is visible instead of silently missing. */
  function renderDayCompare(place, series) {
    var sources = sourcesFor(place);
    var head = "<th></th>", body = "", i, j, date, provider, hi, lo, weekend;
    var weekends = [], highs, deviation, at;
    if (!series) {
      $("day-head").innerHTML = head;
      $("day-body").innerHTML = "";
      return;
    }
    for (i = 0; i < series.time.length; i++) {
      date = parseIsoDate(series.time[i]);
      weekends.push(date.getDay() === 0 || date.getDay() === 6);
      head += "<th" + (weekends[i] ? ' class="weekend"' : "") + ">" +
        '<span class="hh">' + dayName(date.getDay()) + "</span>" +
        '<span class="dd2">' + formatDate(date) + "</span></th>";
    }
    $("day-head").innerHTML = head;

    for (j = 0; j < sources.length; j++) {
      provider = seriesFor(place, sources[j][0]);
      body += '<tr><td class="src' + (provider ? "" : " off") + '">' +
        sourceLabel(sources[j][0], sources[j][1]) + "</td>";
      for (i = 0; i < series.time.length; i++) {
        at = dayIndex(provider, series.time[i]);
        hi = at >= 0 ? provider.max[at] : null;
        lo = at >= 0 ? provider.min[at] : null;
        body += "<td" + (weekends[i] ? ' class="weekend"' : "") + ">" +
          (hi === null
            ? '<span class="na">\u00b7</span>'
            : iconForWmo(provider.code ? provider.code[at] : null) +
              '<span class="hi">' + round(hi) + "\u00b0</span>" +
              '<span class="lo">' + round(lo) + "\u00b0</span>") +
          "</td>";
      }
      body += "</tr>";
    }

    body += '<tr class="spread"><td class="src">' + t("spreadRow") + "</td>";
    for (i = 0; i < series.time.length; i++) {
      highs = [];
      for (j = 0; j < sources.length; j++) {
        provider = seriesFor(place, sources[j][0]);
        at = dayIndex(provider, series.time[i]);
        highs.push(at >= 0 ? provider.max[at] : null);
      }
      deviation = spread(highs);
      body += "<td>" +
        (deviation >= 2 ? "\u00b1" + Math.round(deviation) : "") + "</td>";
    }
    body += "</tr>";
    $("day-body").innerHTML = body;
  }

  /* Monthly normals as a reference line above the table: the forecast read
     against what this month usually looks like. */
  function renderStats(place, series) {
    var normals = state.normals && state.normals.places ? state.normals.places[place.id] : null;
    var month = (new Date()).getMonth();

    if (!normals) {
      $("month-stats").innerHTML = '<span class="lo">' + t("noNormals") + "</span>";
      return;
    }
    var delta = null, sum = 0, count = 0, k;
    if (series) {
      for (k = 0; k < 8 && k < series.max.length; k++) {
        if (series.max[k] !== null && series.max[k] !== undefined) {
          sum += series.max[k];
          count++;
        }
      }
      if (count) delta = sum / count - normals.tmax[month];
    }
    $("month-stats").innerHTML =
      "<b>" + t("monthsLong")[month] + "</b>" +
      '<span class="sp"></span>' +
      "<span>" + t("normalsPeriod", { period: state.normals.period }) + ":</span>" +
      '<span class="sp"></span>' +
      '<span class="stat"><span class="k">' + t("normalsLow") + "</span> <b>" +
      round(normals.tmin[month]) + "\u00b0</b></span>" +
      '<span class="sp"></span>' +
      '<span class="stat"><span class="k">' + t("normalsHigh") + "</span> <b>" +
      round(normals.tmax[month]) + "\u00b0</b></span>" +
      '<span class="sp"></span>' +
      '<span class="stat"><span class="k">' + t("normalsPrecip") + "</span> <b>" +
      round(normals.precip[month]) + " mm</b></span>" +
      (delta === null ? "" :
        '<span class="sp"></span>' +
        '<span class="stat"><span class="k">' + t("forecastVsNormal") + "</span> " +
        '<b class="' + (delta >= 0 ? "up" : "down") + '">' +
        (delta >= 0 ? "+" : "\u2212") + Math.abs(delta).toFixed(1) +
        "\u00b0</b></span>");
  }

  /* The three screens share one switch: the forecast, the providers by the
     hour, the providers by the day. Only one is mounted at a time, so each
     table gets the whole height under the bar. */
  var PANELS = ["hours", "byhour", "byday"];

  function renderPanels() {
    var show = state.panel, i, value;
    $("panel-forecast").className = "forecast" + (show === "hours" ? " on" : "");
    $("panel-byhour").className = "cmp" + (show === "byhour" ? " on" : "");
    $("panel-byday").className = "cmp" + (show === "byday" ? " on" : "");
    var buttons = $("panel-switch").getElementsByTagName("button");
    for (i = 0; i < buttons.length; i++) {
      value = buttons[i].getAttribute("data-panel");
      buttons[i].className = value === show ? "on" : "";
      buttons[i].textContent = value === "hours" ? t("panelHours")
        : value === "byhour" ? t("cmpHours") : t("cmpDays");
    }
  }

  function renderFooter() {
    var generated = state.data.generated ? Date.parse(state.data.generated) : 0;
    var age = generated ? Math.round((Date.now() - generated) / 60000) : -1;
    var label;
    if (age < 0) label = t("dataUnknown");
    else if (age < 1) label = t("dataFresh");
    else label = t("dataAgo", { n: age });
    var tag = statusTag();
    $("foot-left").textContent = t("dataLabel") + " " + label +
      (tag ? " \u00b7 " + tag : "") + " \u00b7 " + t("refreshLabel") + " " +
      (state.refreshMin === 0 ? t("refreshNow")
        : state.refreshMin + " " + t("refreshMinLabel"));

    var errors = state.data.errors && state.data.errors.length
      ? state.data.errors.join(" \u00b7 ") : "";
    $("legend-link").innerHTML = ICON_LEGEND + "<span>" + t("legend") + "</span>";
    $("install-link").innerHTML = ICON_SETUP + "<span>" + t("setup") + "</span>";
    $("foot-right").innerHTML =
      (errors ? '<span class="err">' + errors + "</span> \u00b7 " : "") +
      (window.navigator.standalone ? t("kiosk") : browserName()) +
      " \u00b7 " + window.innerWidth + "\u00d7" + window.innerHeight +
      " \u00b7 " + (state.direct ? t("srcDirect") : t("srcActions")) +
      ' \u00b7 <span class="ver">v' + APP_VERSION.replace(/^.*\./, "") + "</span>";
  }

  function renderClock() {
    var now = new Date();
    $("clock").textContent = pad2(now.getHours()) + ":" + pad2(now.getMinutes());
  }

  function render() {
    var place = currentPlace();
    document.documentElement.lang = state.lang;
    renderLanguages();
    renderChips();
    var series = renderCurrent(place);
    /* If the primary model has nothing, fall back to whatever provider did
       answer, so one working source still fills the screen. */
    if (!series) series = seriesFor(place, "met");
    renderHours(place);
    renderStrip(place, series);
    renderCompare(place, series);
    renderStats(place, series);
    renderPanels();
    renderFooter();
  }

  var NIGHT_START = 22;
  var NIGHT_END = 7;
  var AWAKE_MS = 60 * 1000;

  var awakeUntil = 0;
  var dimTimer = null;

  function isNightTime() {
    var hour = (new Date()).getHours();
    return hour >= NIGHT_START || hour < NIGHT_END;
  }

  function applyDim() {
    var layer = $("dim");
    if (!isNightTime()) {
      layer.className = "";
      return;
    }
    layer.className = (new Date()).getTime() < awakeUntil ? "soft" : "on";
  }

  function wakeScreen() {
    if (!isNightTime()) return;
    awakeUntil = (new Date()).getTime() + AWAKE_MS;
    applyDim();
    if (dimTimer) window.clearTimeout(dimTimer);
    dimTimer = window.setTimeout(applyDim, AWAKE_MS + 80);
  }

  var retryDelay = 3000;
  var retryTimer = null;
  var lastSuccess = 0;
  var versionChecked = false;

  function scheduleRetry() {
    if (retryTimer) return;
    retryTimer = window.setTimeout(function () {
      retryTimer = null;
      refresh();
    }, retryDelay);
    retryDelay = Math.min(retryDelay * 2, 60000);
  }

  var MODELS = ["ecmwf_ifs025", "icon_seamless",
                "knmi_seamless", "dmi_seamless"];

  /* Each provider is asked separately: a slow or dead one must not hold back
     the numbers that did arrive. */
  function refresh() {
    if (!state.data || !state.data.places) { bootstrap(); return; }
    var place = currentPlace();
    var pending = 3;

    function arrived(ok) {
      pending--;
      if (ok) render();
      if (pending === 0 && !ok) scheduleRetry();
    }

    fetchPlaceForecast(place, function (ok) {
      if (ok) { state.direct = true; lastSuccess = (new Date()).getTime(); retryDelay = 3000; }
      arrived(ok);
    });
    fetchMet(place, arrived);
    fetchProviders(place, arrived);
  }

  function loadNormals() {
    var request = new XMLHttpRequest();
    request.open("GET", "normals.json", true);
    request.timeout = 20000;
    request.onload = function () {
      if (request.status >= 200 && request.status < 300) {
        try {
          state.normals = JSON.parse(request.responseText);
          if (state.data) render();
        } catch (e) {}
      }
    };
    request.send();
  }

  function seedPlaces() {
    var places = [], i, place;
    for (i = 0; i < SEED_PLACES.length; i++) {
      place = SEED_PLACES[i];
      places.push({
        id: place.id, name: place.name, lat: place.lat, lon: place.lon,
        ele: place.ele, country: place.country, admin1: place.admin1,
        models: {}, current: {}, met: null, providers: {}
      });
    }
    return places;
  }

  /* Everything the page shows comes from the device: the starting places are
     here, the numbers are cached per place. */
  function bootstrap() {
    state.data = { places: seedPlaces(), generated: null, errors: [] };
    attachCustom();
    var places = state.data.places, i, newest = 0;
    for (i = 0; i < places.length; i++) {
      loadPlaceCache(places[i]);
      if (places[i].fetchedAt && places[i].fetchedAt > newest) newest = places[i].fetchedAt;
    }
    /* the footer should say how old the cache is, not "unknown" */
    if (newest) {
      var when = new Date(newest).toISOString().replace(/\.[0-9]+Z$/, "Z");
      state.data.generated = when;
      lastSuccess = newest;
    }
    render();
  }

  /* iOS suspends standalone web apps; on resume the page may be hours old. */
  function refreshMs() {
    return (state.refreshMin > 0 ? state.refreshMin : 1) * 60 * 1000;
  }

  function setProvider(value) {
    state.provider = value;
    try { window.localStorage.setItem(STORE_PROVIDER, value); } catch (e) {}
    if (state.data) render();
  }

  function setRefreshMinutes(value) {
    var minutes = parseInt(value, 10);
    if (isNaN(minutes) || REFRESH_STEPS.indexOf(minutes) < 0) return;
    state.refreshMin = minutes;
    try { window.localStorage.setItem(STORE_REFRESH, String(minutes)); } catch (e) {}
    renderFooter();
  }

  function refreshIfStale() {
    if (!state.data) { bootstrap(); return; }
    if ((new Date()).getTime() - lastSuccess > refreshMs()) {
      retryDelay = 3000;
      refresh();
    }
  }

  function setCity(id) {
    state.cityId = id;
    try { window.localStorage.setItem(STORE_CITY, id); } catch (e) {}
    var place = findPlace(id);
    if (place) loadPlaceCache(place);
    if (state.data) render();
    if (place && state.data) {
      fetchPlaceForecast(place, function (ok) { if (ok) render(); });
      fetchMet(place, function (ok) { if (ok) render(); });
      fetchProviders(place, function (ok) { if (ok) render(); });
    }
  }

  function setLang(lang) {
    if (!STRINGS[lang]) return;
    state.lang = lang;
    try { window.localStorage.setItem(STORE_LANG, lang); } catch (e) {}
    if (state.data) render();
    if ($("legend-panel").className.indexOf("open") >= 0) renderLegend();
    if ($("install").className.indexOf("open") >= 0) renderInstall();
  }

  /* A new shell can only be picked up by navigating to a URL Safari has not
     cached; the meta version tells us when that is worth doing. */
  function reloadApp(version) {
    try {
      window.localStorage.setItem(STORE_RELOAD,
        JSON.stringify({ version: version, at: (new Date()).getTime() }));
    } catch (e) {}
    window.location.replace(location.pathname + "?v=" + encodeURIComponent(version));
  }

  function checkVersion() {
    var request = new XMLHttpRequest();
    request.open("GET", "index.html?t=" + (new Date()).getTime(), true);
    request.timeout = 20000;
    request.onload = function () {
      if (request.status < 200 || request.status >= 300) return;
      var match = /name="app-version"\s+content="([^"]+)"/.exec(request.responseText);
      if (!match || match[1] === APP_VERSION) return;
      var attempt = null;
      try { attempt = JSON.parse(window.localStorage.getItem(STORE_RELOAD) || "null"); } catch (e) {}
      /* Give an attempt time to land, but never block forever. */
      if (attempt && attempt.version === match[1] &&
          ((new Date()).getTime() - attempt.at) < 10 * 60 * 1000) {
        return;
      }
      reloadApp(match[1]);
    };
    request.send();
  }

  $("chips").onclick = function (event) {
    var node = event.target;
    while (node && node.getAttribute &&
           !node.getAttribute("data-id") && !node.getAttribute("data-action")) {
      node = node.parentNode;
    }
    if (!node || !node.getAttribute) return;
    if (node.getAttribute("data-action") === "open") { go("mjesta"); return; }
    var id = node.getAttribute("data-id");
    if (id) setCity(id);
  };

  $("foot-left").onclick = openLog;
  $("log-close").onclick = function () { $("logpanel").className = "overlay"; };

  $("legend-link").onclick = function () { go("legenda"); };
  $("install-link").onclick = function () { go("setup"); };
  $("legend-close").onclick = function () { go(""); };
  $("install-close").onclick = function () { go(""); };

  document.addEventListener("change", function (event) {
    var node = event.target;
    if (!node || !node.name) return;
    if (node.name === "home-provider") setProvider(node.value);
    else if (node.name === "refresh-interval") setRefreshMinutes(node.value);
  }, false);

  document.addEventListener("click", function (event) {
    var id = event.target && event.target.id;
    if (id === "save-keys") {
      setKey("meteoblue", ($("key-meteoblue").value || "").trim());
      go("");
      refresh();
    } else if (id === "reset-app") {
      if (window.confirm(t("installResetAsk"))) resetApp();
    }
  }, false);

  function resetApp() {
    var keys = [], i, key;
    try {
      for (i = 0; i < window.localStorage.length; i++) {
        key = window.localStorage.key(i);
        if (key && key.indexOf("wh.") === 0) keys.push(key);
      }
      for (i = 0; i < keys.length; i++) window.localStorage.removeItem(keys[i]);
    } catch (e) {}
    window.location.replace(window.location.pathname);
  }

  $("search").oninput = function () {
    renderOverlay(this.value);
    scheduleGeo(this.value.trim());
  };
  $("close").onclick = function () { go(""); };

  $("ovlist").onclick = function (event) {
    var node = event.target, star = null, select = null, add = null, del = null;
    var fav = null, depth = 0;
    while (node && node.getAttribute && depth < 4) {
      if (add === null && node.getAttribute("data-add") !== null) {
        add = node.getAttribute("data-add");
      }
      if (fav === null && node.getAttribute("data-fav") !== null) {
        fav = node.getAttribute("data-fav");
      }
      if (del === null && node.getAttribute("data-del")) del = node.getAttribute("data-del");
      node = node.parentNode;
      depth++;
    }
    if (del) { removeCustomPlace(del); renderOverlay($("search").value); return; }
    if (fav !== null) { addPlace(geoResults[+fav], true); return; }
    if (add !== null) { addPlace(geoResults[+add], false); return; }
    node = event.target; depth = 0;
    while (node && node.getAttribute && depth < 4) {
      if (!star && node.getAttribute("data-star")) star = node.getAttribute("data-star");
      if (!select && node.getAttribute("data-select")) select = node.getAttribute("data-select");
      node = node.parentNode;
      depth++;
    }
    if (star) {
      toggleFavorite(star);
      renderChips();
      renderOverlay($("search").value);
      return;
    }
    if (select) {
      setCity(select);
      closeOverlay();
    }
  };

  $("lang").onclick = function (event) {
    var lang = event.target.getAttribute && event.target.getAttribute("data-lang");
    if (lang) setLang(lang);
  };

  function setPanel(panel) {
    if (panel === state.panel) return;
    if (PANELS.indexOf(panel) < 0) return;
    state.panel = panel;
    try { window.localStorage.setItem(STORE_PANEL, panel); } catch (e) {}
    if (state.data) render();
  }

  $("panel-switch").onclick = function (event) {
    var panel = event.target.getAttribute && event.target.getAttribute("data-panel");
    if (panel) setPanel(panel);
  };

  $("refresh").onclick = function () {
    this.className = "refresh busy";
    refresh();
  };

  $("foot-right").onclick = function (event) {
    var node = event.target;
    if (node && node.className && String(node.className).indexOf("ver") >= 0) {
      reloadApp(String((new Date()).getTime()));
    }
  };

  /* Pull down anywhere to refetch the visible place; the selected city stays. */
  var pullStartY = 0, pullActive = false;

  document.addEventListener("touchstart", function (event) {
    pullStartY = event.touches[0].clientY;
    /* On a phone the page scrolls, so a downward drag is usually just
       scrolling. Only a pull that starts at the very top refreshes. */
    pullActive = !(document.documentElement.scrollTop ||
                   document.body.scrollTop || window.pageYOffset) &&
                 $("overlay").className.indexOf("open") < 0 &&
                 $("legend-panel").className.indexOf("open") < 0 &&
                 $("install").className.indexOf("open") < 0;
  }, false);

  document.addEventListener("touchend", function (event) {
    if (!pullActive) return;
    pullActive = false;
    var dy = event.changedTouches[0].clientY - pullStartY;
    if (dy > 90) refresh();
  }, false);

  function parseFavorites(raw) {
    var parsed = null;
    if (!raw) return DEFAULT_FAVS.slice(0);
    try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
    if (!parsed || !parsed.length) return DEFAULT_FAVS.slice(0);
    return parsed;
  }

  var savedCity = null, savedLang = null, savedFavs = null;
  var savedProvider = null, savedRefresh = null;
  try {
    savedCity = window.localStorage.getItem(STORE_CITY);
    savedLang = window.localStorage.getItem(STORE_LANG);
    savedFavs = window.localStorage.getItem(STORE_FAVS);
    savedProvider = window.localStorage.getItem(STORE_PROVIDER);
    savedRefresh = window.localStorage.getItem(STORE_REFRESH);
  } catch (e) {}
  if (savedCity) state.cityId = savedCity;
  if (savedProvider === "auto" || HOME_PROVIDERS.indexOf(savedProvider) >= 0) {
    state.provider = savedProvider;
  }
  if (savedRefresh !== null && savedRefresh !== "") {
    var savedMinutes = parseInt(savedRefresh, 10);
    if (REFRESH_STEPS.indexOf(savedMinutes) >= 0) state.refreshMin = savedMinutes;
  }
  state.favs = parseFavorites(savedFavs);
  try {
    var savedPanel = window.localStorage.getItem(STORE_PANEL);
    if (PANELS.indexOf(savedPanel) >= 0) state.panel = savedPanel;
  } catch (e) {}
  state.lang = STRINGS[savedLang] ? savedLang
    : (/^hr/i.test(navigator.language || "") ? "hr" : "en");

  renderLanguages();

  /* Cold start: places live in the page, numbers in the per-place cache, so the
     screen is painted before the first request leaves. */
  logLine("start " + APP_VERSION + " \u00b7 " + (navigator.onLine ? "online" : "offline"));
  loadCustom();
  bootstrap();
  applyHash();
  loadNormals();
  refresh();
  window.setInterval(function () {
    if ((new Date()).getTime() - lastSuccess >= refreshMs()) refresh();
  }, 60 * 1000);
  window.setInterval(checkVersion, 10 * 60 * 1000);
  document.addEventListener("touchstart", wakeScreen, true);
  document.addEventListener("click", wakeScreen, true);
  applyDim();
  window.setInterval(applyDim, 30 * 1000);
  renderClock();
  window.setInterval(renderClock, 10 * 1000);

  window.addEventListener("hashchange", applyHash);
  window.addEventListener("pageshow", function () {
    refreshIfStale();
    applyHash();
    checkVersion();
    renderClock();
  });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { refreshIfStale(); renderClock(); }
  });
})();
</script>
</body>
</html>
