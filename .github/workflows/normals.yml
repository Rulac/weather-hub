name: update normals

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normals:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute monthly normals
        run: python3 scripts/normals.py
      - name: Commit normals.json
        run: |
          git config user.name "weather-hub bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add normals.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "normals: $(date -u +%Y-%m-%d)"
            git push
          fi
